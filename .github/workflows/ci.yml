name: Continuous integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match package.json: the monorepo requires Node >= 24.15 and npm 11.13.
  NODE_VERSION: "24"
  NPM_VERSION: "11.13.0"

jobs:
  quality:
    name: Lint, unit tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the required npm version
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build all applications
        run: npm run build

  api-e2e:
    name: API end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: insurshield
          POSTGRES_PASSWORD: insurshield_ci_password
          POSTGRES_DB: insurshield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insurshield -d insurshield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    # These are deliberately non-production values. The E2E harness replaces
    # DATABASE_URL with TEST_DATABASE_URL before it resets and migrates only
    # the isolated insurshield_test database.
    env:
      NODE_ENV: test
      PORT: "4000"
      API_PREFIX: api/v1
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: postgresql://insurshield:insurshield_ci_password@127.0.0.1:5432/insurshield
      DATABASE_POOL_SIZE: "10"
      TEST_DATABASE_URL: postgresql://insurshield:insurshield_ci_password@127.0.0.1:5432/insurshield_test
      SWAGGER_ENABLED: "false"
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:4000
      TRUST_PROXY_HOPS: "0"
      AUTH_RATE_LIMIT: "off"
      API_RATE_LIMIT: "off"
      RTSA_ANNIVERSARY_FEE_NGWEE: "50000"
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      S3_BUCKET: insurshield-documents-test
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      S3_SIGNED_URL_TTL_SECONDS: "300"
      MAX_UPLOAD_BYTES: "3145728"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the required npm version
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Create the isolated E2E database
        env:
          PGPASSWORD: insurshield_ci_password
        run: |
          until pg_isready --host=127.0.0.1 --port=5432 --username=insurshield --dbname=insurshield; do sleep 1; done
          psql --host=127.0.0.1 --port=5432 --username=insurshield --dbname=insurshield \
            --set=ON_ERROR_STOP=1 \
            --command='CREATE DATABASE insurshield_test;'

      - name: Build the API for E2E migration checks
        run: npm run build -w @insurshield/api

      - name: Run API end-to-end tests
        run: npm run test:e2e -w @insurshield/api

  web-mock-e2e:
    name: Mock API browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the required npm version
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npm exec -w @insurshield/web -- playwright install --with-deps chromium

      - name: Run mock browser journey
        run: npm run test:e2e -w @insurshield/web -- --project=chromium

  web-real-api:
    name: Real API browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: insurshield
          POSTGRES_PASSWORD: insurshield_ci_password
          POSTGRES_DB: insurshield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insurshield -d insurshield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      PORT: "4000"
      API_PREFIX: api/v1
      CORS_ORIGINS: http://127.0.0.1:5181
      DATABASE_URL: postgresql://insurshield:insurshield_ci_password@127.0.0.1:5432/insurshield
      DATABASE_POOL_SIZE: "10"
      TEST_DATABASE_URL: postgresql://insurshield:insurshield_ci_password@127.0.0.1:5432/insurshield_test
      SWAGGER_ENABLED: "false"
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:4000
      TRUST_PROXY_HOPS: "0"
      AUTH_RATE_LIMIT: "off"
      API_RATE_LIMIT: "off"
      RTSA_ANNIVERSARY_FEE_NGWEE: "50000"
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      S3_BUCKET: insurshield-documents-test
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      S3_SIGNED_URL_TTL_SECONDS: "300"
      MAX_UPLOAD_BYTES: "3145728"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use the required npm version
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build and migrate the API
        run: |
          npm run build -w @insurshield/api
          npm run db:migrate -w @insurshield/api

      - name: Install Chromium
        run: npm exec -w @insurshield/web -- playwright install --with-deps chromium

      - name: Run the API and the real browser journey
        run: |
          npm run start:prod -w @insurshield/api > api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat api.log' EXIT
          until curl --fail --silent http://127.0.0.1:4000/health/ready > /dev/null; do sleep 1; done
          npm run test:e2e -w @insurshield/web -- --project=real-api
