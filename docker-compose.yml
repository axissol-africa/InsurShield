# Local development infrastructure.
#
# Both services speak the same protocols as their AWS counterparts, so moving to
# production is a change of environment variables rather than a change of code:
#   postgres -> Amazon RDS for PostgreSQL   (DATABASE_URL)
#   minio    -> Amazon S3                   (S3_* variables; MinIO is S3-compatible)

services:
  postgres:
    image: postgres:17-alpine
    container_name: insurshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: insurshield
      POSTGRES_PASSWORD: insurshield
      POSTGRES_DB: insurshield
      # Match the collation/encoding RDS uses so local and production sort alike.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the Keycloak database on a fresh volume.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurshield -d insurshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO's own images on quay.io now require authentication, so this uses
  # Chainguard's build of the same binary; it ships `mc`, which the healthcheck
  # and the bucket-init container below both use.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: insurshield-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: insurshield
      MINIO_ROOT_PASSWORD: insurshield-dev-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console -> http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the private documents bucket on first boot, then exits.
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 insurshield insurshield-dev-secret &&
      mc mb --ignore-existing local/insurshield-documents &&
      mc anonymous set none local/insurshield-documents &&
      echo 'bucket ready: insurshield-documents (private)'
      "

volumes:
  postgres-data:
  minio-data:
